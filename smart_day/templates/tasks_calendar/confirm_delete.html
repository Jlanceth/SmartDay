{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-start pt-2">
        <div class="col-md-5">
            <div class="card shadow-sm rounded-4 border-2 border-danger-subtle">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                    <h4 class="mt-3">Удалить задачу?</h4>
                    <p class="text-muted">Вы уверены, что хотите удалить задачу <strong>"{{ task.title }}"</strong>? Это действие нельзя отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger rounded-pill">Да, удалить</button>
                            <a href="{% url 'tasks_calendar:list' %}" class="btn btn-light rounded-pill">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
