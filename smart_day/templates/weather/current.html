{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4">Метеорологическая обстановка</h2>
    
    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <h5 class="text-muted">Пермь</h5>
                    <div class="display-1 fw-bold text-primary my-3">
                        +18°C
                    </div>
                    <p class="h4">Облачно с прояснениями</p>
                    <i class="bi bi-cloud-sun text-warning" style="font-size: 5rem;"></i>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-4 h-100">
                <div class="card-body p-4">
                    <h5 class="mb-4">Факторы среды</h5>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                        <span><i class="bi bi-moisture text-info me-2"></i> Влажность</span>
                        <span class="fw-bold">65%</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                        <span><i class="bi bi-wind text-secondary me-2"></i> Ветер</span>
                        <span class="fw-bold">4 м/с</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                        <span><i class="bi bi-activity text-danger me-2"></i> Геомагнитный фон</span>
                        <span class="badge bg-warning text-dark">3 балла (Слабый)</span>
                    </div>
                    <p class="small text-muted mt-3">
                        <i class="bi bi-info-circle me-1"></i> Данные обновлены 10 минут назад
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
