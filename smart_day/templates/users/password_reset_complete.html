{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-start pt-2">
        <div class="col-md-5">
            <div class="card shadow-sm rounded-4 border-0 text-center p-4">
                <div class="card-body">
                    <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    <h2 class="mt-3">Готово!</h2>
                    <p class="text-muted">Ваш пароль был успешно изменен. Теперь вы можете войти в систему, используя новые данные.</p>
                    <div class="d-grid mt-4">
                        <a href="{% url 'users:login' %}" class="btn btn-primary">Войти в аккаунт</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
