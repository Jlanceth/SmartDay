{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-start pt-2">
        <div class="col-md-5">
            <div class="card shadow-sm rounded-4 border-0 text-center p-4">
                <div class="card-body">
                    <i class="bi bi-envelope-check-fill text-primary" style="font-size: 4rem;"></i>
                    <h2 class="mt-3">Письмо отправлено</h2>
                    <p class="text-muted">
                        Мы отправили инструкции по восстановлению пароля на указанный вами адрес электронной почты. 
                    </p>
                    <div class="alert alert-info small border-0 shadow-sm mt-3">
                        Если письмо не пришло в течение пары минут, проверьте папку <strong>«Спам»</strong>.
                    </div>
                    <div class="d-grid mt-4">
                        <a href="{% url 'users:login' %}" class="btn btn-primary">Вернуться ко входу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
